    <!-- Font Awesome -->
    <link rel="stylesheet"

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #d9e2ec);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            width: 90%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo img {
            max-width: 180px;
            margin-bottom: 25px;
        }

        h1.title {
            margin-bottom: 30px;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* MENU */
        .menu a {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            background: #f4f6f8;
            color: #2c3e50;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #e1e6eb;
            text-align: left;
        }

        /* ICON AGAR RATA */
        .menu a i {
            width: 28px;
            min-width: 28px;
            text-align: center;
            font-size: 22px;
            transition: transform 0.35s ease, color 0.35s ease;
        }

        /* HOVER */
        .menu a:hover {
            background: #2c3e50;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .menu a:hover i {
            color: #ffffff;
            transform: scale(1.3) rotate(-8deg);
        }

        /* ICON COLOR PER MENU */
        .icon-blue   { color: #1e88e5; }
        .icon-purple { color: #8e24aa; }
        .icon-green  { color: #2e7d32; }
        .icon-orange { color: #f57c00; }
        .icon-gray   { color: #455a64; }
        .icon-red    { color: #c62828; }

        /* =========================================
           DIGITAL CALIPER - MENU 9
           ========================================= */
        .caliper-icon {
            width: 28px;
            min-width: 28px;
            height: 28px;
            color: #1e88e5;
            transition: transform 0.35s ease, color 0.35s ease;
            overflow: visible;
        }

        .menu a:hover .caliper-icon {
            color: #ffffff;
            transform: scale(1.3) rotate(-5deg);
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #7f8c8d;
        }
    </style>
</head>
